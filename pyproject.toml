[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xanther-xce"
version = "0.2.0"
description = "Open-source context engine for coding agents — architecture-aware code intelligence with cross-session memory"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Xanther AI", email = "raj@xanther.ai"},
]
keywords = ["coding-agent", "context-engine", "code-intelligence", "memory", "neo4j", "embeddings", "swe-bench"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "neo4j>=5.0,<6.0",
    "openai>=1.0,<2.0",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-php>=0.23",
    "tree-sitter-kotlin>=0.23",
    "tree-sitter-swift>=0.7",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0,<2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
memory = [
    "opensearch-py>=2.4,<3.0",
]
indexing = [
    "asyncpg>=0.29,<1.0",
    "langgraph>=0.2,<0.3",
    "langchain-core>=0.3,<0.4",
    "unidiff>=0.7",
]
all = [
    "xanther-xce[mcp,memory,indexing]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://xanther.ai"
Repository = "https://github.com/Xanther-Ai/xanther-context-engine"
Documentation = "https://xanther.ai/docs"
Issues = "https://github.com/Xanther-Ai/xanther-context-engine/issues"

[project.scripts]
xanther = "xce.cli.interactive:main"
xce = "xce.__main__:main"
xce-mcp-server = "xce.server.cli:run"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.hatch.build.targets.wheel]
packages = ["xce"]

[tool.hatch.build.targets.sdist]
include = ["xce/", "README.md", "LICENSE", "pyproject.toml"]
