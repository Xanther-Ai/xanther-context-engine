[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xanther-context-engine"
version = "0.1.0"
description = "Graph RAG context retrieval system for coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "neo4j>=5.0,<6.0",
    "asyncpg>=0.29,<1.0",  # PostgreSQL support for incremental indexing
    "langgraph>=0.2,<0.3",
    "langchain-core>=0.3,<0.4",
    "openai>=1.0,<2.0",
    "mcp>=1.0,<2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
    "unidiff>=0.7",
    "pydantic-settings>=2.0",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-php>=0.23",
    "tree-sitter-kotlin>=0.23",
    "tree-sitter-swift>=0.7",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
]

[project.optional-dependencies]
memory = [
    "xanther-memory-engine>=0.1.0",  # optional memory layer
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
]
xme = [
    "opensearch-py>=2.4,<3.0",
]
xme-full = [
    "opensearch-py>=2.4,<3.0",
    "neo4j>=5.0,<6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[project.scripts]
xce-mcp-server = "xce.server.cli:run"
xme = "xme.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["xce"]
